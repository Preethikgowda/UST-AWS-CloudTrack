services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/intelliwealth-frontend:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
    environment:
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
