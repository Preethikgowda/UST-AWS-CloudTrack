# ============================================================
# IntelliWealth - Docker Compose (Local Development)
# ============================================================

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: intelliwealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelliwealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelliwealth_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-intelliwealth_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelliwealth} -d ${POSTGRES_DB:-intelliwealth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - intelliwealth-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: intelliwealth-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intelliwealth-network

  # ---- Portfolio Service ----
  portfolio-service:
    build:
      context: ./portfolio-service
      dockerfile: Dockerfile
      target: runtime
    container_name: intelliwealth-portfolio-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intelliwealth}:${POSTGRES_PASSWORD:-intelliwealth_secret_2026}@postgres:5432/${POSTGRES_DB:-intelliwealth_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-secure-random-string-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PORTFOLIO_SERVICE_HOST: "0.0.0.0"
      PORTFOLIO_SERVICE_PORT: "8000"
      PORTFOLIO_SERVICE_LOG_LEVEL: ${PORTFOLIO_SERVICE_LOG_LEVEL:-info}
      PORTFOLIO_SERVICE_CORS_ORIGINS: ${PORTFOLIO_SERVICE_CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - intelliwealth-network

  # ---- Market Intelligence Service ----
  market-service:
    build:
      context: ./market-service
      dockerfile: Dockerfile
      target: runtime
    container_name: intelliwealth-market-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intelliwealth}:${POSTGRES_PASSWORD:-intelliwealth_secret_2026}@postgres:5432/${POSTGRES_DB:-intelliwealth_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      REDIS_ANALYTICS_TTL: ${REDIS_ANALYTICS_TTL:-600}
      MARKET_SERVICE_HOST: "0.0.0.0"
      MARKET_SERVICE_PORT: "8001"
      MARKET_SERVICE_LOG_LEVEL: ${MARKET_SERVICE_LOG_LEVEL:-info}
      MARKET_SERVICE_CORS_ORIGINS: ${MARKET_SERVICE_CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - intelliwealth-network

  # ---- Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-IntelliWealth}
    container_name: intelliwealth-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      portfolio-service:
        condition: service_healthy
      market-service:
        condition: service_healthy
    networks:
      - intelliwealth-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  intelliwealth-network:
    driver: bridge
    name: intelliwealth-network
