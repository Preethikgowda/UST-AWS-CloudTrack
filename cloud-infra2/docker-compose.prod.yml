services:
  portfolio-service:
    image: ${DOCKERHUB_USERNAME}/intelliwealth-portfolio-service:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORTFOLIO_SERVICE_CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  market-service:
    image: ${DOCKERHUB_USERNAME}/intelliwealth-market-service:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      MARKET_SERVICE_CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      REDIS_ANALYTICS_TTL: ${REDIS_ANALYTICS_TTL:-3600}
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  default:
    driver: bridge
